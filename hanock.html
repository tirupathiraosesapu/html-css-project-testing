<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>UI/UX Designer Portfolio</title>

    <link rel="stylesheet" href="hanock.css" />
  </head>

  <body>
    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
      <div class="logo">LOGO</div>

      <nav class="navbar">
        <a href="#" class="active">Home</a>

        <a href="#">Services</a>

        <a href="#">About me</a>

        <a href="#">Portfolio</a>

        <a href="#">Contact me</a>

      <a href="#" class="header-button"> Hire Me </a>
    </header>

    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="hero">
      <!-- Orange star-shaped background glow -->
      <div class="star-glow"></div>

      <!-- =========================
             LEFT CONTENT
        ========================== -->

      <section class="hero-content">
        <p class="intro">Hi I am</p>

        <h2 class="name">Mahmood Fazile</h2>

        <h1 class="title">UI/UX designer</h1>

        <!-- =========================
                 SOCIAL ICONS
            ========================== -->

        <div class="social-icons">

          <a href="#" class="social"> in </a>

          <a href="#" class="social"> ◉ </a>

          <a href="#" class="social"> Be </a>
        </div>

        <!-- =========================
                 BUTTONS
            ========================== -->

        <div class="hero-buttons">
          <a href="#" class="hire-button"> Hire Me </a>

          <a href="#" class="cv-button"> Download CV </a>
        </div>

        <!-- =========================
                 STATISTICS
            ========================== -->

        <div class="statistics">
          <div class="stat">
            <h3>5+</h3>

            <p>Experiences</p>
          </div>

          <div class="vertical-line"></div>

          <div class="stat">
            <h3>20+</h3>

            <p>Project done</p>
          </div>

          <div class="vertical-line"></div>

          <div class="stat">
            <h3>80+</h3>

            <p>Happy Clients</p>
          </div>
        </div>
      </section>

      <!-- =========================
             RIGHT IMAGE
        ========================== -->

      <section class="hero-image-section">
        <div class="image-circle">
          <img src="profile.png" alt="Profile" />
        </div>
      </section>
    </main>

</html>
